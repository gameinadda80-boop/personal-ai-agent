<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Agent</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 340px;
            text-align: center;
        }
        h1 { color: #333; margin-bottom: 5px; font-size: 24px; }
        p.subtitle { color: #888; margin-top: 0; font-size: 14px; margin-bottom: 25px; }
        input[type="password"] {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            margin-bottom: 15px;
            transition: border-color 0.2s;
        }
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #5568d3; }
        .error {
            color: #dc3545;
            font-size: 14px;
            margin-bottom: 15px;
            padding: 8px;
            background: #f8d7da;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>🔒 AI Agent</h1>
        <p class="subtitle">Enter your password to continue</p>
        
        <div id="error-msg" class="error" style="display:none;">
            ❌ Incorrect password. Please try again.
        </div>
        
        <form action="/login" method="POST">
            <input type="password" name="password" placeholder="Password" required autofocus />
            <button type="submit">Unlock</button>
        </form>
    </div>

    <script>
        // Show error if redirected back with ?error=1
        if (window.location.search.includes('error=1')) {
            document.getElementById('error-msg').style.display = 'block';
        }
    </script>
</body>
</html>
